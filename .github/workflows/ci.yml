name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Dummy values so the build can validate env. Not real keys.
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: dummy-publishable-key
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
          SITE_URL: http://localhost:3000
          SESSION_SIGNING_SECRET: dummy-session-signing-secret-for-ci-only-0000
          CRON_SECRET: dummy-cron-secret-for-ci-only-0000

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # TODO: pin every `uses:` action to a commit SHA once someone with GitHub access can look them up.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - run: supabase db start
      - run: supabase test db

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
