# Local development and CI config. Checked against Supabase CLI docs; it cannot be
# run in every sandbox, so CI (`supabase db start`, `supabase test db`) is the check.
project_id = "rec-reports-live"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
